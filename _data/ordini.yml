- title: Scuola dell'infanzia "Arcobaleno"
  text: 'Tre sezioni per bambini dai 3 ai 6 anni: gioco, scoperta, autonomia e prime esperienze di laboratorio, con un orto didattico e un giardino attrezzato.'
  url: /didattica/offerta-formativa/
- title: Scuola primaria "Gianni Rodari"
  text: Tempo normale a 27 ore e tempo pieno a 40 ore. Lingua inglese dalla prima, musica con esperto, educazione motoria e laboratori di lettura e coding.
  url: /didattica/offerta-formativa/
- title: Scuola secondaria di primo grado "Bruno Munari"
  text: Tempo scuola a 30 ore, due lingue comunitarie (inglese e spagnolo o tedesco), indirizzo musicale e laboratori di arte, tecnologia e robotica.
  url: /didattica/offerta-formativa/
