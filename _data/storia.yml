- anno: 1962
  data: Settembre 1962
  title: La prima scuola di frazione
  text: Apre la scuola elementare "Gianni Rodari" con quattro aule e circa cento bambini, nel cuore del paese.
- anno: 1974
  data: Ottobre 1974
  title: Nasce la scuola media
  text: 'Viene inaugurata la sede di via Garibaldi: la scuola secondaria di primo grado accoglie ragazzi dei comuni vicini.'
- anno: 1999
  data: Settembre 1999
  title: Autonomia scolastica
  text: La scuola diventa istituzione autonoma e cura per la prima volta un proprio piano dell'offerta formativa.
- anno: 2012
  data: Settembre 2012
  title: Nasce l'Istituto Comprensivo
  text: Infanzia, primaria e secondaria si uniscono in un unico istituto con un percorso continuo dai 3 ai 14 anni.
- anno: 2019
  data: Giugno 2019
  title: Intitolazione a Bruno Munari
  text: L'istituto sceglie il nome del designer e artista che ha insegnato a giocare con le forme e con la fantasia.
- anno: 2024
  data: Settembre 2024
  title: Munari Lab
  text: Si inaugura il laboratorio di arte e tecnologia aperto a tutti gli ordini di scuola.
