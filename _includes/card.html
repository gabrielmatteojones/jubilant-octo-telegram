{% assign it = include.item %}
<a class="card" href="{{ it.url | relative_url }}">
  <div class="card__media" style="--tint: {{ it.colore | default: '#ffd166' }}">
    {% if it.immagine and it.immagine != "" %}
      <img src="{{ it.immagine | relative_url }}" alt="" loading="lazy">
    {% else %}
      <span class="card__emoji" aria-hidden="true">{{ it.emoji | default: '🎲' }}</span>
    {% endif %}
  </div>
  {% if it.categoria %}<span class="tag">{{ it.categoria }}</span>{% endif %}
  <h3 class="card__t">{{ it.title }}</h3>
  <p class="card__d">{{ it.descrizione | default: it.excerpt | strip_html | truncate: 110 }}</p>
</a>
