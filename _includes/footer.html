<footer class="footer">
  <div class="wrap">
    <div class="footer__top">
      <div class="footer__logo">GABRIEL<br>JONES</div>
      {% include social.html %}
    </div>
    <div class="footer__mid">
      <div class="footer__links">
        <ul>
          <li><a href="{{ '/chi-sono/' | relative_url }}">Chi sono</a></li>
          <li><a href="{{ '/contatti/' | relative_url }}">Contatti</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
        </ul>
        <ul>
          <li><a href="{{ '/raccolta-giochi/' | relative_url }}">Raccolta giochi</a></li>
          <li><a href="{{ '/giochi/' | relative_url }}">Anteprima giochi</a></li>
        </ul>
        <ul>
          <li><a href="{{ '/libri/' | relative_url }}">Libri</a></li>
          <li><a href="{{ '/film-serie/' | relative_url }}">Film e serie tv</a></li>
          <li><a href="{{ '/grafica/' | relative_url }}">Grafica</a></li>
        </ul>
      </div>
      <form class="newsletter" name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="{{ '/grazie/' | relative_url }}">
        <input type="hidden" name="form-name" value="newsletter">
        <p class="sr"><label>Non compilare: <input name="bot-field"></label></p>
        <p class="newsletter__t">Ricevi i nuovi giochi e le novità via email</p>
        <label class="sr" for="nl-nome">Nome</label>
        <input id="nl-nome" name="nome" type="text" placeholder="Nome" required>
        <label class="sr" for="nl-email">Email</label>
        <input id="nl-email" name="email" type="email" placeholder="Email" required>
        <button type="submit" class="btn btn--ghost">Iscriviti</button>
      </form>
    </div>
    <div class="footer__bot">
      <span>© {{ 'now' | date: "%Y" }} {{ site.data.settings.nome }}</span>
      <a href="{{ '/contatti/' | relative_url }}">Contatti</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/admin/' | relative_url }}">Area riservata</a>
    </div>
  </div>
</footer>
