---
layout: default
---
<article>
  <header class="posthead">
    <div class="wrap posthead__in">
      <p class="eyebrow eyebrow--dark">Blog</p>
      <h1>{{ page.title }}</h1>
      {% if page.descrizione %}<p class="posthead__sub">{{ page.descrizione }}</p>{% endif %}
      <p class="posthead__meta">Di <strong>{{ site.data.settings.nome }}</strong> <span>|</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time></p>
    </div>
  </header>
  <div class="wrap">
    {% if page.immagine and page.immagine != "" %}<img class="post__img" src="{{ page.immagine | relative_url }}" alt="">{% endif %}
    <div class="prose">
      {{ content }}
    </div>
    <p class="backlink"><a href="{{ '/blog/' | relative_url }}">← Tutti gli articoli</a></p>
  </div>
</article>
