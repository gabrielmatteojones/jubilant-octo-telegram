backend:
  name: git-gateway
  branch: master   # cambia se usi main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "notizie"
    label: "Notizie"
    folder: "_notizie"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Autore (pid)", name: "autore", widget: "string", required: false }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Argomenti", name: "topics", widget: "list", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }
  - name: "circolari"
    label: "Circolari"
    folder: "_circolari"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Numero", name: "numero", widget: "number" }
      - { label: "Destinatari", name: "destinatari", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Autore (pid)", name: "autore", widget: "string", required: false }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Argomenti", name: "topics", widget: "list", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }
  - name: "eventi"
    label: "Eventi"
    folder: "_eventi"
    create: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Inizio", name: "start", widget: "date" }
      - { label: "Fine", name: "end", widget: "date", required: false }
      - { label: "Ora", name: "ora", widget: "string", required: false }
      - { label: "Luogo", name: "luogo", widget: "string" }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
      - { label: "Contenuto", name: "body", widget: "markdown" }
