<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Illustrazione colorata con dado, libri, matita e forme geometriche">
  <rect width="640" height="520" fill="#fff4d6"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="190" cy="190" r="140" fill="#4cc9f0"/>
    <path d="M60 470 a190 190 0 0 1 380 0 z" fill="#ff9f43"/>
    <rect x="400" y="60" width="150" height="150" rx="22" fill="#b388ff" transform="rotate(14 475 135)"/>
    <polygon points="540,250 556,296 604,298 566,328 580,374 540,348 500,374 514,328 476,298 524,296" fill="#ff8fb8"/>
    <path d="M30 330 q40 -60 80 0 t80 0 t80 0" fill="none" stroke="#8ee36b" stroke-width="14"/>

    <!-- dado -->
    <g transform="rotate(-8 330 320)">
      <rect x="240" y="230" width="190" height="190" rx="34" fill="#fff" stroke="#14172a" stroke-width="7"/>
      <g fill="#14172a">
        <circle cx="285" cy="275" r="14"/><circle cx="385" cy="275" r="14"/>
        <circle cx="335" cy="325" r="14"/>
        <circle cx="285" cy="375" r="14"/><circle cx="385" cy="375" r="14"/>
      </g>
    </g>

    <!-- libri -->
    <g stroke="#14172a" stroke-width="5">
      <rect x="430" y="400" width="190" height="42" rx="6" fill="#ff6b6b"/>
      <rect x="448" y="442" width="160" height="40" rx="6" fill="#2ec4b6"/>
      <rect x="420" y="482" width="200" height="38" rx="6" fill="#ffd23f"/>
    </g>

    <!-- matita -->
    <g transform="translate(70 450) rotate(-38)" stroke="#14172a" stroke-width="5">
      <rect x="0" y="0" width="220" height="38" fill="#ffd23f"/>
      <rect x="0" y="0" width="34" height="38" fill="#ff8fb8"/>
      <polygon points="220,0 270,19 220,38" fill="#f6d5a8"/>
      <polygon points="252,12 270,19 252,26" fill="#14172a"/>
    </g>
    <circle cx="580" cy="30" r="16" fill="#ff6b6b"/>
    <circle cx="40" cy="60" r="12" fill="#2ec4b6"/>
    <circle cx="610" cy="200" r="10" fill="#14172a"/>
  </g>
</svg>
